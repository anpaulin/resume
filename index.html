<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ariel Paulin — Resume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            position: relative;
        }

        img {
            width: 65%;
            height: auto;
            display: block;
            margin: auto;
        }

        .download-button {
            position: fixed;
            top: 24px;
            right: 24px;
            background-color: #1a1a2e;
            color: #ffffff;
            padding: 14px 28px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.04em;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }

        .download-button:hover {
            background-color: #16213e;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .download-button:active {
            transform: translateY(0);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 600px) {
            img {
                width: 100%;
                max-width: 100%;
                object-fit: contain;
            }

            .download-button {
                padding: 16px 30px;
                font-size: 16px;
                top: 16px;
                right: 16px;
            }
        }
    </style>
</head>
<body>

<a href="https://raw.githubusercontent.com/anpaulin/resume/master/standard/ariel_paulin.pdf" download class="download-button">
    Download Resume
</a>

<img src="https://raw.githubusercontent.com/anpaulin/resume/master/standard/ariel_paulin.png" alt="Ariel Paulin Resume">

</body>
</html>
