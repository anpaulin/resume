<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ariel Paulin — Resume</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            position: relative;
        }

        img {
            width: 65%;
            height: auto;
            display: block;
            margin: auto;
        }

        .download-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
        }

        .download-button:hover {
            background-color: #45a049;
        }

        @media (max-width: 600px) {
            img {
                width: 100%;
                max-width: 100%;
                object-fit: contain;
            }

            .download-button {
                padding: 12px 25px;
                font-size: 18px;
                position: absolute;
                top: 20px;
                right: 20px;
            }
        }
    </style>
</head>
<body>

<a href="https://raw.githubusercontent.com/anpaulin/resume/master/standard/ariel_paulin.pdf" download class="download-button">
    Download Resume
</a>

<img src="https://raw.githubusercontent.com/anpaulin/resume/master/standard/ariel_paulin.png" alt="Ariel Paulin Resume">

</body>
</html>
