<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ariel Paulin — Resume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            position: relative;
            padding: 40px 0;
            box-sizing: border-box;
        }

        img {
            width: 65%;
            height: auto;
            display: block;
            margin: auto;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            border-radius: 4px;
        }

        .download-container {
            position: fixed;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 8px;
            z-index: 100;
        }

        .download-button {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.03em;
            padding: 12px 20px;
            border-radius: 10px;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
        }

        .download-button.primary {
            background-color: #1a1a2e;
            color: #ffffff;
        }

        .download-button.primary:hover {
            background-color: #16213e;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        .download-button.secondary {
            background-color: #ffffff;
            color: #1a1a2e;
            border: 1px solid #d0d0d5;
        }

        .download-button.secondary:hover {
            background-color: #f8f9fa;
            border-color: #1a1a2e;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .download-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        /* Retro Hint Badge */
        .konami-hint {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            color: #888899;
            background: rgba(255, 255, 255, 0.85);
            padding: 4px 12px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            user-select: none;
            cursor: pointer;
            transition: opacity 0.3s ease, color 0.3s ease;
        }

        .konami-hint:hover {
            color: #0395DE;
        }

        /* Space Invaders Game Overlay */
        #game-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: #090a10;
            overflow: hidden;
            font-family: 'Press Start 2P', monospace;
            color: #ffffff;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .game-hud {
            position: absolute;
            top: 16px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            font-size: 13px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(3, 149, 222, 0.8);
            z-index: 10001;
        }

        .game-hud .score-val {
            color: #00ffcc;
        }

        .game-hud .wave-val {
            color: #ff0077;
        }

        .game-close-btn {
            pointer-events: auto;
            background: #ff0055;
            color: #fff;
            border: none;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
            transition: transform 0.15s ease;
        }

        .game-close-btn:hover {
            transform: scale(1.08);
            background: #ff2277;
        }

        /* Mobile Controls */
        .mobile-controls {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 10002;
        }

        .mobile-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 16px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: manipulation;
        }

        .mobile-btn:active {
            background: rgba(0, 255, 204, 0.4);
            border-color: #00ffcc;
        }

        .mobile-fire-btn {
            width: 80px;
            height: 80px;
            background: rgba(255, 0, 85, 0.3);
            border-color: #ff0055;
            font-size: 11px;
        }

        .mobile-fire-btn:active {
            background: rgba(255, 0, 85, 0.7);
        }

        @media (max-width: 600px) {
            body {
                padding: 70px 0 20px 0;
            }

            img {
                width: 95%;
                max-width: 100%;
                object-fit: contain;
            }

            .download-container {
                top: 12px;
                right: 12px;
                left: 12px;
                justify-content: center;
                gap: 6px;
            }

            .download-button {
                padding: 10px 12px;
                font-size: 12px;
            }

            .mobile-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>

<!-- Download Actions Bar -->
<div class="download-container">
    <a href="https://raw.githubusercontent.com/anpaulin/resume/master/standard/ariel_paulin.pdf" download class="download-button primary">
        PDF
    </a>
    <a href="https://raw.githubusercontent.com/anpaulin/resume/master/standard/ariel_paulin.png" download class="download-button secondary">
        PNG
    </a>
    <a href="https://raw.githubusercontent.com/anpaulin/resume/master/standard/ariel_paulin.json" download class="download-button secondary">
        JSON
    </a>
    <a href="https://raw.githubusercontent.com/anpaulin/resume/master/standard/ariel_paulin.txt" download class="download-button secondary">
        TXT
    </a>
</div>

<!-- Resume Image View -->
<img src="https://raw.githubusercontent.com/anpaulin/resume/master/standard/ariel_paulin.png" alt="Ariel Paulin Resume">

<!-- Retro Hint Badge -->
<div class="konami-hint" id="konami-trigger" title="Click or enter Konami Code">
    🎮 ↑ ↑ ↓ ↓ ← → ← → B A
</div>

<!-- Space Invaders Overlay -->
<div id="game-overlay">
    <div class="game-hud">
        <div>SCORE: <span id="game-score" class="score-val">0</span></div>
        <div>WAVE: <span id="game-wave" class="wave-val">1</span></div>
        <button class="game-close-btn" id="game-exit-btn">EXIT [ESC]</button>
    </div>
    <canvas id="game-canvas"></canvas>

    <div class="mobile-controls">
        <div style="display: flex; gap: 12px;">
            <div class="mobile-btn" id="m-left">←</div>
            <div class="mobile-btn" id="m-right">→</div>
        </div>
        <div class="mobile-btn mobile-fire-btn" id="m-fire">FIRE</div>
    </div>
</div>

<script>
// --- Web Audio API Synth ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
}

function playPew() {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
    } catch (e) {}
}

function playExplosion() {
    if (!audioCtx) return;
    try {
        const bufferSize = audioCtx.sampleRate * 0.2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
        filter.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
        noise.stop(audioCtx.currentTime + 0.2);
    } catch (e) {}
}

function playPowerUp() {
    if (!audioCtx) return;
    try {
        const now = audioCtx.currentTime;
        const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
        notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.05);
            gain.gain.setValueAtTime(0.2, now + idx * 0.05);
            gain.gain.linearRampToValueAtTime(0.01, now + (idx + 1) * 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.05);
            osc.stop(now + (idx + 1) * 0.05);
        });
    } catch (e) {}
}

function playGameOverSound() {
    if (!audioCtx) return;
    try {
        const now = audioCtx.currentTime;
        const notes = [440, 349.23, 293.66, 220];
        notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now + idx * 0.12);
            gain.gain.setValueAtTime(0.25, now + idx * 0.12);
            gain.gain.linearRampToValueAtTime(0.01, now + (idx + 1) * 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.12);
            osc.stop(now + (idx + 1) * 0.12);
        });
    } catch (e) {}
}

// --- Konami Code Detector ---
const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
let konamiIdx = 0;

window.addEventListener('keydown', (e) => {
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const expected = konamiCode[konamiIdx].length === 1 ? konamiCode[konamiIdx].toLowerCase() : konamiCode[konamiIdx];

    if (key === expected) {
        konamiIdx++;
        if (konamiIdx === konamiCode.length) {
            konamiIdx = 0;
            startSpaceInvaders();
        }
    } else {
        konamiIdx = 0;
    }
});

document.getElementById('konami-trigger').addEventListener('click', () => {
    startSpaceInvaders();
});

// --- Space Invaders Engine ---
const TECH_STACK = [
    { name: 'Scala', color: '#DE3423' },
    { name: 'Java', color: '#F8981D' },
    { name: 'SQL', color: '#00758F' },
    { name: 'Akka', color: '#15A9CE' },
    { name: 'Spark', color: '#E25A1C' },
    { name: 'Kafka', color: '#231F20' },
    { name: 'Flink', color: '#E6526F' },
    { name: 'Play', color: '#9CD719' },
    { name: 'Spring Boot', color: '#6DB33F' },
    { name: 'React', color: '#61DAFB' },
    { name: 'GCP', color: '#4285F4' },
    { name: 'Azure', color: '#0078D4' },
    { name: 'AWS', color: '#FF9900' },
    { name: 'Docker', color: '#2496ED' },
    { name: 'Kubernetes', color: '#326CE5' },
    { name: 'Terraform', color: '#844FBA' },
    { name: 'Grafana', color: '#F46800' },
    { name: 'Git', color: '#F05032' },
    { name: 'Claude Code', color: '#D97706' }
];

let gameActive = false;
let isGameOver = false;
let animId = null;
let score = 0;
let wave = 1;
let waveBannerTimer = 0;

const overlay = document.getElementById('game-overlay');
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('game-score');
const waveEl = document.getElementById('game-wave');
const exitBtn = document.getElementById('game-exit-btn');

let player = { x: 0, y: 0, w: 40, h: 20, speed: 6, dx: 0 };
let bullets = [];
let invaders = [];
let particles = [];
let keys = {};
let invaderDirection = 1;
let baseInvaderSpeed = 1.0;
let currentInvaderSpeed = 1.0;
let totalWaveInvaders = 24;
let lastShot = 0;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    player.y = canvas.height - 60;
    if (player.x === 0) player.x = canvas.width / 2 - player.w / 2;
}

function startSpaceInvaders() {
    initAudio();
    playPowerUp();
    gameActive = true;
    isGameOver = false;
    overlay.style.display = 'block';
    resizeCanvas();
    score = 0;
    wave = 1;
    scoreEl.textContent = score;
    waveEl.textContent = wave;
    spawnInvaders();
    player.x = canvas.width / 2 - player.w / 2;
    bullets = [];
    particles = [];

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('keydown', handleGameKeyDown);
    window.addEventListener('keyup', handleGameKeyUp);

    if (animId) cancelAnimationFrame(animId);
    gameLoop();
}

function restartGame() {
    isGameOver = false;
    score = 0;
    wave = 1;
    scoreEl.textContent = score;
    waveEl.textContent = wave;
    player.x = canvas.width / 2 - player.w / 2;
    bullets = [];
    particles = [];
    spawnInvaders();
    playPowerUp();
}

function triggerGameOver() {
    if (isGameOver) return;
    isGameOver = true;
    playGameOverSound();
    createExplosion(player.x + player.w / 2, player.y + player.h / 2, '#00ffcc');
}

function stopSpaceInvaders() {
    gameActive = false;
    isGameOver = false;
    overlay.style.display = 'none';
    if (animId) cancelAnimationFrame(animId);
    window.removeEventListener('resize', resizeCanvas);
    window.removeEventListener('keydown', handleGameKeyDown);
    window.removeEventListener('keyup', handleGameKeyUp);
}

exitBtn.addEventListener('click', stopSpaceInvaders);

canvas.addEventListener('click', () => {
    if (isGameOver) restartGame();
});

function handleGameKeyDown(e) {
    if (e.key === 'Escape') stopSpaceInvaders();
    if (isGameOver) {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'r' || e.key === 'R') {
            restartGame();
        }
        return;
    }
    keys[e.key] = true;
    if (e.key === ' ' || e.key === 'ArrowUp') {
        shootLaser();
    }
}

function handleGameKeyUp(e) {
    keys[e.key] = false;
}

// Mobile Button Handlers
const mLeft = document.getElementById('m-left');
const mRight = document.getElementById('m-right');
const mFire = document.getElementById('m-fire');

['touchstart', 'mousedown'].forEach(evt => {
    mLeft.addEventListener(evt, (e) => {
        e.preventDefault();
        if (isGameOver) return;
        keys['ArrowLeft'] = true;
    });
    mRight.addEventListener(evt, (e) => {
        e.preventDefault();
        if (isGameOver) return;
        keys['ArrowRight'] = true;
    });
    mFire.addEventListener(evt, (e) => {
        e.preventDefault();
        if (isGameOver) {
            restartGame();
        } else {
            shootLaser();
        }
    });
});

['touchend', 'mouseup'].forEach(evt => {
    mLeft.addEventListener(evt, (e) => { e.preventDefault(); keys['ArrowLeft'] = false; });
    mRight.addEventListener(evt, (e) => { e.preventDefault(); keys['ArrowRight'] = false; });
});

function spawnInvaders() {
    invaders = [];
    const cols = Math.min(6, Math.floor((canvas.width - 80) / 130));
    const rows = 4;
    totalWaveInvaders = cols * rows;
    const startX = (canvas.width - (cols * 120)) / 2;
    const startY = 80;

    let techIdx = 0;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const tech = TECH_STACK[techIdx % TECH_STACK.length];
            techIdx++;
            invaders.push({
                x: startX + c * 120,
                y: startY + r * 50,
                w: 100,
                h: 36,
                name: tech.name,
                color: tech.color,
                alive: true
            });
        }
    }
    invaderDirection = 1;
    baseInvaderSpeed = 1.0 + (wave - 1) * 0.75;
    currentInvaderSpeed = baseInvaderSpeed;
    waveBannerTimer = 90;
}

function shootLaser() {
    if (isGameOver) return;
    const now = Date.now();
    if (now - lastShot < 180) return;
    lastShot = now;
    bullets.push({
        x: player.x + player.w / 2 - 2,
        y: player.y,
        w: 4,
        h: 14,
        speed: 10
    });
    playPew();
}

function createExplosion(x, y, color) {
    for (let i = 0; i < 20; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1,
            decay: 0.02 + Math.random() * 0.03,
            color: color
        });
    }
    playExplosion();
}

function update() {
    if (isGameOver) {
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= p.decay;
        });
        particles = particles.filter(p => p.life > 0);
        return;
    }

    // Player Movement
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
        player.x -= player.speed;
    }
    if (keys['ArrowRight'] || keys['d'] || keys['D']) {
        player.x += player.speed;
    }
    player.x = Math.max(10, Math.min(canvas.width - player.w - 10, player.x));

    // Bullets
    bullets.forEach(b => b.y -= b.speed);
    bullets = bullets.filter(b => b.y > -20);

    // Invaders Count & Speed Calculation
    let hitEdge = false;
    let aliveCount = 0;

    invaders.forEach(inv => {
        if (inv.alive) aliveCount++;
    });

    const aliveRatio = totalWaveInvaders > 0 ? (aliveCount / totalWaveInvaders) : 1;
    currentInvaderSpeed = baseInvaderSpeed * (1 + (1 - aliveRatio) * 1.2);

    invaders.forEach(inv => {
        if (!inv.alive) return;
        inv.x += currentInvaderSpeed * invaderDirection;
        if (inv.x <= 10 || inv.x + inv.w >= canvas.width - 10) {
            hitEdge = true;
        }

        if (inv.y + inv.h >= player.y) {
            triggerGameOver();
        } else if (
            inv.x < player.x + player.w &&
            inv.x + inv.w > player.x &&
            inv.y < player.y + player.h &&
            inv.y + inv.h > player.y
        ) {
            triggerGameOver();
        }
    });

    if (hitEdge) {
        invaderDirection *= -1;
        invaders.forEach(inv => {
            if (inv.alive) inv.y += 18;
        });
    }

    // Bullet & Invader Collision
    bullets.forEach(b => {
        invaders.forEach(inv => {
            if (inv.alive &&
                b.x < inv.x + inv.w &&
                b.x + b.w > inv.x &&
                b.y < inv.y + inv.h &&
                b.y + b.h > inv.y) {

                inv.alive = false;
                b.y = -999;
                score += 100 * wave;
                scoreEl.textContent = score;
                createExplosion(inv.x + inv.w / 2, inv.y + inv.h / 2, inv.color);
            }
        });
    });

    // Wave Complete Check
    if (aliveCount === 0 && !isGameOver) {
        wave++;
        waveEl.textContent = wave;
        playPowerUp();
        spawnInvaders();
    }

    // Banner Timer
    if (waveBannerTimer > 0) {
        waveBannerTimer--;
    }

    // Particles
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
    });
    particles = particles.filter(p => p.life > 0);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background Stars
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    for (let i = 0; i < 30; i++) {
        const sx = (Math.sin(i * 99 + Date.now() * 0.0005) * 0.5 + 0.5) * canvas.width;
        const sy = (Math.cos(i * 33 + Date.now() * 0.0003) * 0.5 + 0.5) * canvas.height;
        ctx.fillRect(sx, sy, 2, 2);
    }

    // Draw Player Ship (if not game over)
    if (!isGameOver) {
        ctx.fillStyle = '#00ffcc';
        ctx.shadowColor = '#00ffcc';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(player.x + player.w / 2, player.y);
        ctx.lineTo(player.x + player.w, player.y + player.h);
        ctx.lineTo(player.x, player.y + player.h);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // Draw Bullets
    ctx.fillStyle = '#ff0055';
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 8;
    bullets.forEach(b => {
        ctx.fillRect(b.x, b.y, b.w, b.h);
    });
    ctx.shadowBlur = 0;

    // Draw Tech Invaders
    invaders.forEach(inv => {
        if (!inv.alive) return;

        ctx.fillStyle = '#141722';
        ctx.strokeStyle = inv.color;
        ctx.lineWidth = 2;
        ctx.shadowColor = inv.color;
        ctx.shadowBlur = 8;

        ctx.beginPath();
        ctx.roundRect(inv.x, inv.y, inv.w, inv.h, 6);
        ctx.fill();
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.font = '10px "Inter", sans-serif';
        ctx.fontWeight = '700';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(inv.name, inv.x + inv.w / 2, inv.y + inv.h / 2);
    });

    // Draw Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 4, 4);
    });
    ctx.globalAlpha = 1.0;

    // Wave Banner Overlay
    if (waveBannerTimer > 0 && !isGameOver) {
        ctx.save();
        ctx.fillStyle = '#ff0077';
        ctx.shadowColor = '#ff0077';
        ctx.shadowBlur = 15;
        ctx.font = '24px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const alpha = Math.min(1.0, waveBannerTimer / 30);
        ctx.globalAlpha = alpha;
        ctx.fillText(`WAVE ${wave} SPEED UP!`, canvas.width / 2, canvas.height / 2);
        ctx.restore();
    }

    // --- GAME OVER OVERLAY SCREEN ---
    if (isGameOver) {
        ctx.save();
        ctx.fillStyle = 'rgba(9, 10, 16, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff0055';
        ctx.shadowColor = '#ff0055';
        ctx.shadowBlur = 20;
        ctx.font = '32px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 60);

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.font = '14px "Press Start 2P", monospace';
        ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, canvas.height / 2);
        ctx.fillText(`WAVE REACHED: ${wave}`, canvas.width / 2, canvas.height / 2 + 30);

        const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
        ctx.fillStyle = `rgba(0, 255, 204, ${pulse})`;
        ctx.shadowColor = '#00ffcc';
        ctx.shadowBlur = 10;
        ctx.font = '13px "Press Start 2P", monospace';
        ctx.fillText('PRESS SPACE OR CLICK TO RESTART', canvas.width / 2, canvas.height / 2 + 90);

        ctx.restore();
    }
}

function gameLoop() {
    if (!gameActive) return;
    update();
    draw();
    animId = requestAnimationFrame(gameLoop);
}
</script>

</body>
</html>
