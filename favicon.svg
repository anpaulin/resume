<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="apGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  
  <!-- Background Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0d1117" stroke="url(#borderGrad)" stroke-width="3" />
  
  <!-- Monogram AP -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" fill="url(#apGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="28" letter-spacing="-1">AP</text>
</svg>
